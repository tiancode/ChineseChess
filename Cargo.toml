[package]
name = "chinese_chess"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ab_glyph = "0.2"
# default-features off drops the audio-file decoders (symphonia, etc.); cpal
# playback is unconditional in rodio, and we only feed it synthesised samples.
rodio = { version = "0.20", default-features = false }

[profile.release]
opt-level = 3
lto = true
